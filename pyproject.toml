[project]
name = "skillloom"
version = "0.1.0"
description = "A local Catalog and Projection manager for Agent Skills"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.1a0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = [".agents/skills"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "N", "W", "PL", "UP"]
ignore = ["A002", "B905", "F403", "N812", "N999", "PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
".agents/skills/*/scripts/*.py" = ["E501"]
